# gitleaks configuration — common template
# Docs: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "ai-workspace-common-template gitleaks config"

[extend]
# Inherit all default rules from the upstream gitleaks config
useDefault = true

[allowlist]
description = "Allowlist for known false positives"
regexes = [
  # Placeholder values in .env.sample and docs
  '''your[_-]?(api[_-]?)?key[_-]?here''',
  '''your[_-]?secret[_-]?here''',
  '''replace[_-]?with[_-]?actual''',
  '''example[_\-.]com''',
  # All-caps placeholder tokens used in documentation examples
  '''YOUR_API_KEY''',
  '''YOUR_TOKEN''',
  '''YOUR_SECRET''',
  # gitleaks:allow inline marker (single-line suppression)
  '''gitleaks:allow''',
  # Preserved from this project's prior .gitleaks.toml (not in the current common template):
  '''DEVELOPER:Down1oad''',
]
paths = [
  '''\.env\.sample''',
  # .env is gitignored and never committed; --no-git mode scans the raw
  # filesystem regardless of .gitignore, so exclude it here explicitly
  # (mirrors the same fix already present in the L0 workspace-root config)
  '''\.env$''',
  '''CHANGELOG\.md''',
  '''.*_test\.(js|ts|py|go|rs)$''',
  '''.*\.test\.(js|ts)$''',
  '''.*_spec\.rb$''',
  # _examples/ contains illustrative content with realistic-looking values
  # (memory/ is deliberately NOT excluded: it is git-tracked in scaffolded
  #  projects, so secrets pasted into session logs must stay scannable —
  #  mirror of the L0 workspace-root policy)
  '''_examples/.*''',
  # Local dependency/build directories — gitignored, never committed, but
  # --no-git mode scans them anyway; third-party library internals (test
  # fixtures, crypto constant names, etc.) commonly trip generic secret regexes
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  # Preserved from this project's prior .gitleaks.toml (not in the current common template):
  '''^scratch/stable/zadt_vsp_git\.prog\.abap$''',
  '''^scratch/stable/zabapgit_standalone\.prog\.abap$''',
]


# Preserved from this project's prior .gitleaks.toml (not in the current common template):
[[rules]]
id = "co-abap-aws-access-key"
description = "AWS access key id (co-abap custom pattern)"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]

[[rules]]
id = "co-abap-github-pat-classic"
description = "GitHub classic personal access token (co-abap custom pattern)"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]

[[rules]]
id = "co-abap-github-oauth"
description = "GitHub OAuth token (co-abap custom pattern)"
regex = '''gho_[A-Za-z0-9]{30,}'''
tags = ["key", "GitHub"]

[[rules]]
id = "co-abap-github-fine-grained-pat"
description = "GitHub fine-grained personal access token (co-abap custom pattern)"
regex = '''github_pat_[A-Za-z0-9_]{20,}'''
tags = ["key", "GitHub"]

[[rules]]
id = "co-abap-anthropic-key"
description = "Anthropic API key (co-abap custom pattern)"
regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
tags = ["key", "Anthropic"]

[[rules]]
id = "co-abap-openai-project-key"
description = "OpenAI project API key (co-abap custom pattern)"
regex = '''sk-proj-[a-zA-Z0-9\-_]{20,}'''
tags = ["key", "OpenAI"]

[[rules]]
id = "co-abap-openai-legacy-key"
description = "OpenAI legacy API key (co-abap custom pattern)"
regex = '''sk-[0-9a-zA-Z]{48}'''
tags = ["key", "OpenAI"]

[[rules]]
id = "co-abap-slack-token"
description = "Slack token (co-abap custom pattern)"
regex = '''xox[baprs]-[A-Za-z0-9-]{10,}'''
tags = ["key", "Slack"]

[[rules]]
id = "co-abap-private-key-block"
description = "PEM private key header (co-abap custom pattern)"
regex = '''-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----'''
tags = ["key", "PrivateKey"]
