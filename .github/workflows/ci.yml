name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit:
    name: Documentation Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # Full history: the VERSION_MANIFEST gate derives per-file dates from
          # `git log` — a depth-1 clone collapses every date to the checkout
          # commit and makes the gate fail on any manifest generated elsewhere.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # package.json lives at the repository root, not under scripts/.
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun scripts/audit.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ hashFiles('bun.lock') != '' }}
        run: bun install --frozen-lockfile

      - name: Security audit - dependency vulnerabilities
        shell: bash
        run: |
          # Fleet dependency-vulnerability gate (2026-10-01 fleet assessment FW-1).
          # Threshold matches the L0 root gate (.github/workflows/test.yml):
          # fail on high or critical; low/moderate findings are reported only.
          # bun audit exits 1 whenever any finding exists, so the exit code
          # alone cannot separate findings from infrastructure failures — the
          # severity summary line is the source of truth, and empty output is
          # treated as a loud infra failure.
          audit_output=$(bun audit 2>&1) || true
          echo "$audit_output"
          if [ -z "$audit_output" ]; then
            echo "ERROR: bun audit produced no output (possible registry/infrastructure failure)."
            exit 1
          fi
          if echo "$audit_output" | grep -qE '[1-9][0-9]* (high|critical)'; then
            echo "ERROR: High or critical vulnerabilities found. See audit output above."
            exit 1
          fi
          echo "Security check passed (no high/critical vulnerabilities)."


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # The action requires a GITLEAKS_LICENSE for private repositories and needs
      # pull-requests:read to annotate PRs — neither is warranted here, since all
      # this job needs is a pass/fail scan. Config comes from .gitleaks.toml.
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --config=/github/workspace/.gitleaks.toml --redact --verbose --no-banner

