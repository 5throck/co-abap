name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit:
    name: Documentation Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # Full history: the VERSION_MANIFEST gate derives per-file dates from
          # `git log` — a depth-1 clone collapses every date to the checkout
          # commit and makes the gate fail on any manifest generated elsewhere.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # package.json lives at the repository root, not under scripts/.
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun scripts/audit.ts

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # The action requires a GITLEAKS_LICENSE for private repositories and needs
      # pull-requests:read to annotate PRs — neither is warranted here, since all
      # this job needs is a pass/fail scan. Config comes from .gitleaks.toml.
      - name: Run gitleaks
        # v8.28.0 linux/amd64 manifest, verified locally with
        # `docker manifest inspect ghcr.io/gitleaks/gitleaks:v8.28.0`.
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae
        with:
          args: detect --source=/github/workspace --config=/github/workspace/.gitleaks.toml --redact --verbose --no-banner

  typecheck:
    name: Typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      # Every OS leg must be observed — fail-fast would hide platform-specific
      # breakage behind a cancelled sibling leg.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

  script-tests:
    name: Script Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run script tests
        run: bun run test
