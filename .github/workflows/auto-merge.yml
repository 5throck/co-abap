name: Auto Merge PR on Approval

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  automerge:
    name: Evaluate and Merge Approved PR
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Merge only after every required check succeeds
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          # Required-approval count, overridable per repository. A hard-coded 2
          # was structurally unsatisfiable in this single-collaborator
          # repository: GitHub blocks PR authors from approving their own PRs,
          # so every PR failed the gate and needed a manual merge (see
          # docs/designs/2026-10-02-automerge-approval-gate-design.md).
          AUTOMERGE_MIN_APPROVALS: ${{ vars.AUTOMERGE_MIN_APPROVALS || '0' }}
        with:
          script: |
            // Only check names this repo's CI actually produces (ci.yml:
            // 'Documentation Audit', 'Secret Scan'). Names that never exist
            // make the gate fail closed on every PR (2026-10-01 FW-6).
            const requiredChecks = new Set([
              'Documentation Audit',
              'Secret Scan',
            ]);
            let pr = context.payload.pull_request;
            if (context.eventName === 'workflow_run') {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              pr = associated.data.find(candidate => candidate.state === 'open');
              if (!pr) {
                console.log('No open PR is associated with the completed CI head SHA.');
                return;
              }
            }

            // Never merge PRs whose head lives in a different repository (forks).
            if (pr.head.repo && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              console.log(`PR #${pr.number} head repo ${pr.head.repo.full_name} differs from base; skipping.`);
              return;
            }

            if (pr.state !== 'open') {
              console.log(`PR #${pr.number} is not open; nothing to merge.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const approvals = reviews.filter(
              review => review.state === 'APPROVED' && review.commit_id === pr.head.sha,
            );
            const minApprovals = Number(process.env.AUTOMERGE_MIN_APPROVALS || 0);
            if (approvals.length < minApprovals) {
              core.setFailed(`Only ${approvals.length}/${minApprovals} current-head approvals; refusing to merge.`);
              return;
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            if (checkRuns.length === 0) {
              core.setFailed('No CI check runs found on the head SHA; refusing to merge.');
              return;
            }

            // Matrix jobs (Typecheck / Script Tests) append the OS to the check
            // name, e.g. "Typecheck (windows-latest)" — match on the job-name
            // prefix. The all-checks-success gate below still covers every leg.
            const missing = [...requiredChecks].filter(
              required =>
                !checkRuns.some(
                  check =>
                    check.name === required ||
                    check.name.startsWith(`${required} (`),
                ),
            );
            if (missing.length > 0) {
              core.setFailed(`Required checks missing from the head SHA: ${missing.join(', ')}`);
              return;
            }

            const blocked = checkRuns.filter(
              check => check.status !== 'completed' || check.conclusion !== 'success',
            );
            if (blocked.length > 0) {
              core.setFailed(
                `All checks must conclude success. Blocking checks: ${blocked
                  .map(check => `${check.name}=${check.status}/${check.conclusion ?? 'none'}`)
                  .join(', ')}`,
              );
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              // Merge commit, matching observed repository history (all
              // merged PRs to date are merge commits from manual merges).
              merge_method: 'merge'
            });
            console.log(`✅ PR #${pr.number} merged successfully`);
