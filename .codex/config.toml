[features]
codex_hooks = true

# Routed through the SAP MCP proxy (policy gate, approvals, audit). Safe SAP_* defaults and .env are applied by the proxy.
[mcp_servers.abap]
command = "bun"
args = ["scripts/sap-mcp-proxy.ts", "--", "--mode", "hyperfocused"]

[mcp_servers.abap-docs]
url = "https://mcp-abap.marianzeis.de/mcp"

[mcp_servers.sap-docs]
url = "https://mcp-sap-docs.marianzeis.de/mcp"

[[skills.config]]
enabled = true
path = "skills"

[mcp_servers.graft]
command = "bunx"
args = ["@nanonets/graft", "mcp"]
