description = "Manage SAP Transport Requests (CTS) ??list, create, add objects, release, and check status of transport requests. Runs pre-release quality gate before releasing."
prompt = '''
# Transport

Manage SAP Transport Requests (CTS) for the current task.

Supported actions:

## `list` ??Show open transports
```
/transport list
```
Calls `SAP(action="system", params={"type":"list_transports"})` (R0) and displays all open transport requests in a table:
| Transport | Description | Owner | Status | Objects |

## `create` ??Create a new transport request
```
/transport create <description>
```
Calls `SAP(action="system", params={"type":"create_transport", ...})` (R2 gated: evidence + approval, blocked in manual profile; requires `SAP_ENABLE_TRANSPORTS` / `SAP_FEATURE_TRANSPORT` opted in) with the provided description.
Reports the new transport number (e.g. `NPL K000001`).

## `add` ??Add an object to a transport
```
/transport add <transport_number> <object_url>
```
Calls `SAP(action="system", params={"type":"add_transport_object", ...})` (R2 gated) with the given transport number and ADT object URL.
Confirms the object is listed in the transport after the call.

## `release` ??Release a transport for import
```
/transport release <transport_number>
```
**Before releasing**, automatically verifies:
1. `analyze` `type=syntax_check` passes on all objects in the transport (0 errors)
2. `test` (with coverage) passes (0 failures)
3. `test` `type=atc` has 0 Priority-1 findings

If all checks pass, calls `SAP(action="system", params={"type":"release_transport", ...})` (R3 gated: approval + `passed` evidence for every object, blocked in manual profile; requires `SAP_ENABLE_TRANSPORTS` / `SAP_FEATURE_TRANSPORT` opted in).
If any check fails, reports the failure and **does not release**.

## `status` ??Show details of a specific transport
```
/transport status <transport_number>
```
Calls `SAP(action="system", params={"type":"get_transport", ...})` and displays object list, status, and timestamps.

## Notes

- All calls use the single `mcp__abap__SAP` tool; see [vsp Tool Reference](../../docs/co-abap.context.md#vsp-tool-reference-hyperfocused-mode).

- Transport operations affect the shared SAP system ??always confirm with the user before `release`.
- After release, remind the user to run `/sync` to log the transport number in today's memory file.
- If {{args}} is provided without a sub-action keyword, treat it as `list`.
'''
